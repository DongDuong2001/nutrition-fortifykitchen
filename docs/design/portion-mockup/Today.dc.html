<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hôm nay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Saira+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F1EC; font-family: Manrope, system-ui, sans-serif; color: #111317; padding: 20px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 13px; font-weight: 600; color: #5B5F66">Hôm nay 18/10</span>
    <h1 style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 32px; text-transform: uppercase">Bữa trưa</h1>
  </div>
  <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; border-bottom: 1px solid #EEEBE4">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-weight: 700; font-size: 15px">{{r.name}}</span>
          <span style="font-size: 13px; color: #5B5F66">{{r.detail}}</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0">
          <span style="font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 18px">{{r.amount}}</span>
          <span style="font-size: 12px; color: #5B5F66">{{r.kcal}} kcal</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: 'Khoai lang', detail: 'Cân sống', amount: '200 g', kcal: '172' },
        { name: 'Cơm trắng', detail: 'Đã nấu chín · 100 g × 3', amount: '300 g', kcal: '390' },
        { name: 'Ức gà', detail: 'Đã nấu chín · bằng 214 g lúc sống', amount: '150 g', kcal: '257' },
        { name: 'Trứng gà luộc', detail: 'Cỡ lớn', amount: '3 quả', kcal: '235' },
        { name: 'CanPrev D3 1000 IU', detail: 'Thực phẩm bổ sung', amount: '2 viên', kcal: '0' },
        { name: 'Bún đậu mắm tôm', detail: 'Một phần quán', amount: '1 phần', kcal: '815' }
      ]
    };
  }
}
</script>
</body>
</html>
