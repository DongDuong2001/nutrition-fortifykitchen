</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A9D1F7}a:hover{color:#FFFFFF}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}

</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #0A0A0B; color: #FFFFFF; font-family: 'Be Vietnam Pro', sans-serif; padding: 44px 24px 28px; display: flex; flex-direction: column;">
  <div role="img" aria-label="H1T MICRO" style="align-self: center; margin-top: 16px; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 125%; font-weight: 900; font-size: 28px;">H1T <span style="color: #A9D1F7;">MICRO</span></div>

  <div style="margin-top: 48px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;">
    <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#A9D1F7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3.5 7.5l8.5 6 8.5-6"></path></svg>

    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #C9CDD6;">Đã gửi link đăng nhập tới <strong style="color: #FFFFFF;">ban@email.com</strong>. Link có hiệu lực 15 phút.</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch;">
    <a href="SetupProfile.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Mở ứng dụng Mail</a>
    <button type="button" aria-disabled="true" style="height: 48px; border: 0; border-radius: 9999px; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600; opacity: 0.5; cursor: not-allowed;">Gửi lại link (sau 45 giây)</button>
    <div style="text-align: center;"><a href="SignUp.dc.html" style="font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; font-size: 15px;">Dùng email khác</a></div>
    <div style="font-size: 13px; color: #A3A8B5; text-align: center; line-height: 1.5;">Không thấy email? Kiểm tra mục Spam hoặc Quảng cáo.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
