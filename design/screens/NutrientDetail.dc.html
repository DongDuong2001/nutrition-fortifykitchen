<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Canxi — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="background: #0A0A0B; color: #FFFFFF; padding: 12px 20px 20px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="Micros.dc.html" aria-label="Quay lại Vi chất" style="width: 44px; height: 44px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: -10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="font-size: 14px; color: #A3A8B5;">Vi chất · Hôm nay</div>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 30px;">CANXI</h1>
      <div style="text-align: right;">
        <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 30px;">28%</div>
        <div style="font-size: 13px; color: #C9CDD6; font-variant-numeric: tabular-nums;">331 / 1.200 mg</div>
      </div>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px;">
      <span style="height: 8px; border-radius: 2px; background: #F5A524;"></span><span style="height: 8px; border-radius: 2px; background: #F5A524;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span><span style="height: 8px; border-radius: 2px; background: #2B2D33;"></span>
    </div>
    <div style="font-size: 13px; color: #C9CDD6;">Mục tiêu: 1.200–1.500 mg/ngày. Magie nên bằng khoảng 50% canxi.</div>
  </div>

  <div style="flex: 1 1 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <section style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px 6px;">
      <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 700;">Gợi ý để bù</h2>
      <sc-for list="{{suggest}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #EEF0F3;">
          <span style="flex: 1 1 0; display: flex; flex-direction: column;">
            <span style="font-size: 14px; font-weight: 600;">{{s.name}}</span>
            <span style="font-size: 13px; color: #5B6170;">{{s.meta}}</span>
          </span>
          <a href="AddFood.dc.html" aria-label="Thêm {{s.name}}" style="text-decoration: none; min-height: 44px; min-width: 64px; padding: 0 14px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">+ Thêm</a>
        </div>
      </sc-for>
    </section>
    <section style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px 6px;">
      <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 700;">Đã có từ món ăn hôm nay</h2>
      <sc-for list="{{sources}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; border-top: 1px solid #EEF0F3; font-size: 14px;">
          <span>{{s.name}} <span style="color: #5B6170;">· {{s.qty}}</span></span>
          <span style="font-weight: 600; font-variant-numeric: tabular-nums;">{{s.mg}} mg</span>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const suggest = [
      { name: 'Cá rục xương', meta: 'Ăn cả xương · ~380 mg / 100 g (ước tính)' },
      { name: 'Mật mía Golden Barrel', meta: '1 muỗng ~ 41 mg · dùng trong tập' },
      { name: 'Hạt chia', meta: '15 g ~ 95 mg · tiêu hoá' }
    ];
    const sources = [
      { name: 'Yogurt kefir', qty: '200 ml', mg: '240' },
      { name: 'Yến mạch', qty: '60 g', mg: '32' },
      { name: 'Chà là', qty: '30 g', mg: '20' },
      { name: 'Thịt bò nạc', qty: '150 g', mg: '18' },
      { name: 'Cơm gạo lứt', qty: '150 g', mg: '15' },
      { name: 'Chuối', qty: '1 quả', mg: '6' }
    ];
    return { h: this.props.h ?? 844, suggest, sources };
  }
}
</script>
</body>
</html>
