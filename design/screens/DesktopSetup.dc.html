<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thiết lập (web) — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
.nav-link:hover{background:#17181C}
.row-link:hover{background:#F7F8FA}
.btn-ghost:hover{background:#E3E5E9}
.btn-blue:hover{background:#1747CC}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="min-height: 980px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; padding: 40px 16px; box-sizing: border-box;">
  <div style="width: 100%; max-width: 760px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; border-radius: 20px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px;"><span style="font-weight: 600; color: #5B6170;">Bước 1/2 · Về bạn</span><span style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 20px;">H1T <span style="color: #1E55F0;">MICRO</span></span></div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;"><span style="height: 4px; border-radius: 2px; background: #1E55F0;"></span><span style="height: 4px; border-radius: 2px; background: #E3E5E9;"></span></div>
      <h1 style="margin: 6px 0 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 32px;">VỀ BẠN</h1>
      <p style="margin: 0; font-size: 15px; color: #5B6170; line-height: 1.5;">Mục tiêu được tính theo cân nặng và giới tính. Bạn có thể sửa bất cứ lúc nào.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
        <fieldset style="border: 0; margin: 0; padding: 0; min-width: 0;">
          <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px;">Giới tính</legend>
          <div role="radiogroup" aria-label="Giới tính" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <button type="button" role="radio" aria-checked="true" style="height: 52px; border-radius: 10px; border: 2px solid #0A0A0B; background: #0A0A0B; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer;">Nam</button>
            <button type="button" role="radio" aria-checked="false" style="height: 52px; border-radius: 10px; border: 2px solid #D5D8DF; background: #FFFFFF; color: #1D1D1F; font-size: 16px; font-weight: 600; cursor: pointer;">Nữ</button>
          </div>
        </fieldset>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700;">
            Năm sinh
            <input type="text" inputmode="numeric" value="2003" style="height: 52px; box-sizing: border-box; width: 100%; border-radius: 10px; border: 2px solid #D5D8DF; background: #FFFFFF; padding: 0 14px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none;">
          </label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700;">
            Cân nặng (kg)
            <input type="text" inputmode="decimal" value="65" style="height: 52px; box-sizing: border-box; width: 100%; border-radius: 10px; border: 2px solid #1E55F0; background: #FFFFFF; padding: 0 14px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none;">
          </label>
        </div>
      </div>

      <div style="border-top: 1px solid #EEF0F3; padding-top: 24px; display: flex; flex-direction: column; gap: 14px;">
        <h2 id="goal-title" style="margin: 0; font-size: 20px; font-weight: 700;">Mục tiêu</h2>
        <div role="radiogroup" aria-labelledby="goal-title" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px;">
          <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
            <button type="button" role="radio" aria-checked="{{g.on}}" style="text-align: left; cursor: pointer; min-height: 72px; border-radius: 12px; border: 2px solid {{g.border}}; background: #FFFFFF; color: #1D1D1F; padding: 10px 14px; display: flex; align-items: center; gap: 12px;">
              <span aria-hidden="true" style="width: 20px; height: 20px; flex: none; border-radius: 10px; border: 2px solid {{g.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{g.dot}};"></span></span>
              <span style="flex: 1 1 0; display: flex; flex-direction: column;">
                <span style="font-size: 16px; font-weight: 700;">{{g.name}}</span>
                <span style="font-size: 13px; color: #5B6170;">{{g.note}}</span>
                <span style="font-size: 13px; color: #5B6170; font-variant-numeric: tabular-nums;">{{g.rule}}</span>
              </span>
              <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">{{g.kcal}}</span>
            </button>
          </sc-for>
        </div>

        <div style="background: #F5F5F7; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;">
          <h3 style="margin: 0; font-size: 15px; font-weight: 700;">Mục tiêu mỗi ngày</h3>
          <sc-for list="{{targets}}" as="t" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px;"><span style="color: #5B6170;">{{t.l}}</span><span style="font-weight: 600; font-variant-numeric: tabular-nums;">{{t.v}}</span></div>
          </sc-for>
          <div style="font-size: 13px; color: #5B6170;">Tính cho 65 kg · Nam</div>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;">
        <a class="btn-ghost" href="DesktopSignUp.dc.html" style="text-decoration: none; height: 52px; padding: 0 28px; border-radius: 9999px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.12); color: #1D1D1F; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; box-sizing: border-box;">Quay lại</a>
        <a class="btn-blue" href="DesktopToday.dc.html" style="text-decoration: none; height: 52px; padding: 0 32px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; box-sizing: border-box;">Bắt đầu ghi bữa ăn</a>
      </div>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const goals = [
      { name: 'Tăng cơ', note: 'Ăn dư một chút để lên cơ', rule: '35–40 kcal / kg', kcal: '2.275–2.600' },
      { name: 'Giữ cân', note: 'Duy trì cân nặng hiện tại', rule: '30–35 kcal / kg', kcal: '1.950–2.275', on: true },
      { name: 'Giảm mỡ', note: 'Thâm hụt vừa phải, giữ cơ', rule: '25–30 kcal / kg', kcal: '1.625–1.950' },
      { name: 'Giảm mỡ nhanh', note: 'Ngắn hạn — tối đa 4–6 tuần', rule: '20–25 kcal / kg', kcal: '1.300–1.625' }
    ].map((g) => ({ ...g, on: !!g.on, border: g.on ? '#1E55F0' : '#E3E5E9', dot: g.on ? '#1E55F0' : 'transparent' }));
    const targets = [
      { l: 'Năng lượng', v: '1.950–2.275 kcal' },
      { l: 'Đạm (1,6–2,2 g/kg)', v: '104–143 g' },
      { l: 'Béo (0,5–1 g/kg)', v: '33–65 g' },
      { l: 'Kali (80–100 mg/kg)', v: '5.200–6.500 mg' }
    ];
    return { goals, targets };
  }
}
</script>
</body>
</html>
