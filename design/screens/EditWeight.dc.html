<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cân nặng — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: none; background: #0A0A0B; color: #FFFFFF; padding: 16px 20px 18px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 6px;">
    <a href="Profile.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: -12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 28px;">CÂN NẶNG</h1>
  </div>
  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <label for="kg" style="font-size: 15px; font-weight: 700;">Cân nặng hôm nay</label>
      <div style="display: flex; align-items: center; gap: 14px;">
        <button type="button" aria-label="Giảm 0,1 kg" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid rgba(0,0,0,0.12); background: #FFFFFF; color: #1D1D1F; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">−0,1</button>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <input id="kg" type="text" inputmode="decimal" value="65,0" style="width: 120px; height: 64px; box-sizing: border-box; text-align: center; border: 2px solid #1E55F0; border-radius: 10px; background: #FFFFFF; color: #1D1D1F; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 56px; font-variant-numeric: tabular-nums; padding: 0; outline: none;">
          <span style="font-size: 16px; font-weight: 600; color: #5B6170;">kg</span>
        </div>
        <button type="button" aria-label="Tăng 0,1 kg" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid rgba(0,0,0,0.12); background: #FFFFFF; color: #1D1D1F; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">+0,1</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-self: stretch; border-top: 1px solid #EEF0F3; padding-top: 10px; font-size: 15px;"><span style="color: #5B6170;">Ngày cân</span><span style="font-weight: 600; font-variant-numeric: tabular-nums;">10/10/2026</span></div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 15px; font-weight: 700;">Mục tiêu sẽ cập nhật</div>
      <sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px;"><span style="color: #5B6170;">{{c.l}}</span><span style="font-weight: 600; font-variant-numeric: tabular-nums; text-align: right;">{{c.v}}</span></div>
      </sc-for>
      <div style="font-size: 13px; color: #5B6170;">Tính lại theo cân nặng mới (65,4 → 65,0 kg).</div>
    </div>
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px 6px;">
      <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #5B6170;">Lần cân trước</h2>
      <sc-for list="{{history}}" as="h" hint-placeholder-count="2">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid #EEF0F3; font-size: 15px;"><span style="color: #5B6170; font-variant-numeric: tabular-nums;">{{h.d}}</span><span style="font-weight: 600; font-variant-numeric: tabular-nums;">{{h.v}}</span></div>
      </sc-for>
    </div>
  </div>
  <div style="flex: none; padding: 8px 16px 16px;">
    <a href="Profile.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Lưu</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const changes = [
      { l: 'Năng lượng', v: '1.950–2.275 kcal (giữ nguyên)' },
      { l: 'Đạm', v: '104–143 g' },
      { l: 'Kali', v: '5.200–6.500 mg' }
    ];
    const history = [{ d: '03/10', v: '65,4 kg' }, { d: '26/09', v: '65,8 kg' }];
    return { h: this.props.h ?? 844, changes, history };
  }
}
</script>
</body>
</html>
