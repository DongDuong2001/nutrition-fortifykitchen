<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm món — HITMICRO (mobile web)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; position: relative; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="background: #0A0A0B; height: 150px; flex: none; padding: 16px 20px; box-sizing: border-box; border-radius: 0 0 20px 20px;">
    <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 700; font-size: 20px; color: #FFFFFF;">H1T <span style="color: #A9D1F7;">MICRO</span></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,10,11,0.55);"></div>

  <div role="dialog" aria-label="Thêm món vào Trước tập" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #D5D8DF; align-self: center;"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; align-items: flex-start;">
        <button aria-haspopup="listbox" aria-label="Đổi bữa" style="min-height: 44px; margin: 0 0 0 -8px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; color: #1D1D1F; font-size: 18px; font-weight: 400; cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <span>Thêm vào: <strong style="font-weight: 700;">Trước tập</strong></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <div style="font-size: 13px; color: #5B6170;">Tự chọn theo giờ trong ngày · chạm để đổi</div>
      </div>
      <a href="Today.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 22px; background: #F5F5F7; color: #1D1D1F; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; background: #F5F5F7; border-radius: 9999px; padding: 0 14px; height: 48px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Tìm món</span>
      <input type="search" aria-label="Tìm món" value="chà" placeholder="Tìm món: cơm, trứng, chà là…" style="flex: 1 1 0; height: 44px; background: transparent; border: 0; outline: none; color: #1D1D1F; font-size: 16px;">
    </label>

    <div style="display: flex; gap: 8px; overflow: hidden;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button aria-pressed="{{c.on}}" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: 0; background: {{c.bg}}; color: {{c.color}};">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 13px; font-weight: 600; color: #5B6170;">Gần đây</div>
      <div style="display: flex; gap: 8px; overflow: hidden;">
        <sc-for list="{{recents}}" as="q" hint-placeholder-count="3">
          <button style="flex: none; height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #E3E5E9; background: #FFFFFF; color: #1D1D1F; font-size: 13px; font-weight: 600; cursor: pointer;">{{q}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
        <button style="text-align: left; cursor: pointer; background: {{r.bg}}; border: 0; border-radius: 10px; color: #1D1D1F; padding: 10px 12px; display: flex; align-items: center; gap: 10px; min-height: 52px;">
          <span style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;">{{r.name}}</span>
            <span style="font-size: 13px; color: #5B6170;">{{r.meta}}</span>
          </span>
          <sc-if value="{{r.on}}" hint-placeholder-val="{{false}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E55F0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          </sc-if>
        </button>
      </sc-for>
      <button style="text-align: left; cursor: pointer; background: transparent; border: 0; border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; min-height: 52px;">
        <span style="font-size: 15px; font-weight: 600; color: #1E55F0;">+ Tạo món mới</span>
        <span style="font-size: 13px; color: #5B6170;">Không thấy món? Tự nhập dinh dưỡng</span>
      </button>
    </div>

    <div style="margin-top: auto; background: #0A0A0B; color: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
        <div style="font-size: 17px; font-weight: 700;">Chà là</div>
        <div style="font-size: 13px; color: #A9D1F7; text-align: right;">Nên dùng 30 g đầu buổi tập · carb chậm</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <label style="display: flex; align-items: center; gap: 6px; background: #17181C; border-radius: 8px; height: 44px; padding: 0 12px; width: 100px; box-sizing: border-box;">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Khối lượng</span>
          <input type="text" inputmode="decimal" aria-label="Số gam" value="30" style="width: 44px; height: 44px; background: transparent; border: 0; outline: none; color: #FFFFFF; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;">
          <span style="color: #A3A8B5; font-size: 14px;">g</span>
        </label>
        <button style="height: 44px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; color: #1D1D1F; border: 0; font-size: 13px; font-weight: 700; cursor: pointer;">30 g</button>
        <button style="height: 44px; padding: 0 12px; border-radius: 8px; background: #17181C; color: #FFFFFF; border: 0; font-size: 13px; font-weight: 600; cursor: pointer;">3 quả</button>
        <button style="height: 44px; padding: 0 12px; border-radius: 8px; background: #17181C; color: #FFFFFF; border: 0; font-size: 13px; font-weight: 600; cursor: pointer;">100 g</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{preview}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums;">{{p.v}}</div>
            <div style="font-size: 13px; color: #A3A8B5;">{{p.l}}</div>
          </div>
        </sc-for>
      </div>
      <a href="Today.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Thêm vào Trước tập</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = [
      { label: 'Yêu thích' },
      { label: 'Tất cả', on: true }
    ].map((c) => ({ ...c, on: !!c.on, bg: c.on ? '#0A0A0B' : '#F5F5F7', color: c.on ? '#FFFFFF' : '#0A0A0B' }));
    const results = [
      { name: 'Chà là', meta: '84 kcal / 30 g · 22 g carb · 197 mg kali', on: true },
      { name: 'Bột củ dền', meta: '10 kcal / 3 g · Dalahouse · trước tập' },
      { name: 'Mật mía', meta: '58 kcal / 1 muỗng · Golden Barrel · trong tập' }
    ].map((r) => ({ ...r, on: !!r.on, bg: r.on ? '#EAF1FE' : '#FFFFFF' }));
    const preview = [
      { v: '84', l: 'kcal' },
      { v: '22 g', l: 'Carb' },
      { v: '197', l: 'Kali (mg)' },
      { v: '2 g', l: 'Chất xơ' }
    ];
    const recents = ['Yến mạch 60 g', 'Kefir 200 ml', 'Chuối 1 quả'];
    return { h: this.props.h ?? 844, chips, recents, results, preview };
  }
}
</script>
</body>
</html>
