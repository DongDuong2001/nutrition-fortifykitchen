<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lỗi máy chủ — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column; position: relative;">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0;">Hôm nay</h1>
  <div style="flex: none; background: #0A0A0B; color: #FFFFFF; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 0 0 20px 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 900; font-size: 20px;">H1T <span style="color: #A9D1F7;">MICRO</span></div>
      <div style="display: flex; align-items: center;">
        <button aria-label="Ngày trước" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <div style="font-size: 14px; font-weight: 600;">Hôm nay, 10/10</div>
        <button aria-label="Ngày sau" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; gap: 18px; align-items: center;">
      <div style="position: relative; width: 100px; height: 100px; flex: none;">
        <svg width="100" height="100" viewBox="0 0 120 120" role="img" aria-label="Năng lượng chưa tải được">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#2B2D33" stroke-width="10"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 24px;">—</div>
          <div style="font-size: 13px; color: #A3A8B5;">kcal</div>
        </div>
      </div>
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
        <sc-for list="{{macros}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 600;">{{m.label}}</span><span style="color: #D5D8DF;">—</span></div>
            <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px;">
              <sc-for list="{{m.segs}}" as="s" hint-placeholder-count="10"><div style="height: 6px; border-radius: 2px; background: #2B2D33;"></div></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; color: #C9CDD6;">Mục tiêu <span style="font-weight: 600; color: #FFFFFF; font-variant-numeric: tabular-nums;">1.950–2.275 kcal</span> · còn — · Ngày tập 60′</div>
  </div>

  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div role="alert" style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D93036" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"></path><path d="M12 10v5M12 17.8v.2"></path></svg>
      <div style="font-size: 17px; font-weight: 700;">Không tải được nhật ký</div>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6170;">Máy chủ đang bận. Dữ liệu bạn đã ghi vẫn an toàn trên máy.</p>
      <button type="button" style="align-self: stretch; height: 52px; border: 0; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px;">Thử lại</button>
      <div style="font-size: 13px; color: #5B6170; font-variant-numeric: tabular-nums;">Mã lỗi: 503 · 14:05</div>
    </div>
  </div>

  <nav aria-label="Điều hướng chính" style="height: 72px; flex: none; background: #0A0A0B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="Today.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #FFFFFF; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Hôm nay
    </a>
    <a href="Micros.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #8C92A0; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"></path></svg>Vi chất
    </a>
    <div style="display: flex; justify-content: center;">
      <a href="AddFood.dc.html" aria-label="Thêm món" style="width: 52px; height: 52px; border-radius: 14px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>
    <a href="Training.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #8C92A0; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"></path></svg>Ngày tập
    </a>
    <a href="Profile.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #8C92A0; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Hồ sơ
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const segs = Array.from({ length: 10 }, () => ({}));
    const macros = ['Đạm', 'Tinh bột', 'Béo', 'Chất xơ'].map((label) => ({ label, segs }));
    return { h: this.props.h ?? 844, macros };
  }
}
</script>
</body>
</html>
