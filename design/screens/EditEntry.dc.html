<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sửa món — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; position: relative; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif;">
  <div aria-hidden="true" style="background: #0A0A0B; height: 220px; border-radius: 0 0 20px 20px; padding: 14px 20px; box-sizing: border-box;">
    <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 900; font-size: 20px; color: #FFFFFF;">H1T <span style="color: #A9D1F7;">MICRO</span></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,10,11,0.55);"></div>

  <div role="dialog" aria-label="Sửa Thịt bò nạc" style="position: absolute; left: 0; right: 0; bottom: 0; top: 250px; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 16px;">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #D5D8DF; align-self: center;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-size: 13px; color: #5B6170;">Bữa trưa</div>
        <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 24px;">THỊT BÒ NẠC</h1>
      </div>
      <a href="Today.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 22px; background: #F5F5F7; color: #1D1D1F; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-end;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; width: 120px;">
        Khối lượng
        <span style="display: flex; align-items: center; gap: 6px; height: 48px; border-radius: 10px; border: 2px solid #1E55F0; padding: 0 12px; box-sizing: border-box;">
          <input type="text" inputmode="decimal" aria-label="Số gam" value="150" style="width: 56px; height: 44px; border: 0; outline: none; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; background: transparent;">
          <span style="color: #5B6170; font-size: 14px; font-weight: 400;">g</span>
        </span>
      </label>
      <button style="height: 48px; padding: 0 14px; border: 0; border-radius: 10px; background: #0A0A0B; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer;">150 g</button>
      <button style="height: 48px; padding: 0 14px; border: 0; border-radius: 10px; background: #F5F5F7; color: #1D1D1F; font-size: 14px; font-weight: 600; cursor: pointer;">100 g</button>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0;">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px;">Chuyển sang bữa</legend>
      <div role="radiogroup" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{meals}}" as="m" hint-placeholder-count="5">
          <button role="radio" aria-checked="{{m.on}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: {{m.bg}}; color: {{m.color}}; font-size: 14px; font-weight: 600; cursor: pointer;">{{m.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <div style="background: #F5F5F7; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{preview}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;">{{p.v}}</div>
          <div style="font-size: 13px; color: #5B6170;">{{p.l}}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <a href="Today.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Lưu thay đổi</a>
      <button style="height: 48px; border: 0; border-radius: 10px; background: transparent; color: #D93036; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
        Xoá món này
      </button>
      <div style="font-size: 12px; color: #5B6170; text-align: center;">Sau khi xoá sẽ có nút “Hoàn tác” trong 5 giây.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const meals = ['Bữa sáng', 'Bữa trưa', 'Trước tập', 'Bữa tối', 'Bữa phụ'].map((label) => { const on = label === 'Bữa trưa'; return { label, on, bg: on ? '#0A0A0B' : '#F5F5F7', color: on ? '#FFFFFF' : '#0A0A0B' }; });
    const preview = [
      { v: '320', l: 'kcal' },
      { v: '39 g', l: 'Đạm' },
      { v: '13 g', l: 'Béo' },
      { v: '3,9 mg', l: 'Sắt' }
    ];
    return { h: this.props.h ?? 844, meals, preview };
  }
}
</script>
</body>
</html>
