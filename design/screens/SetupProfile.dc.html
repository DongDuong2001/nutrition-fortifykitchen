<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hồ sơ cơ thể — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="background: #0A0A0B; color: #FFFFFF; padding: 16px 20px 22px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="SignUp.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="font-size: 13px; color: #A3A8B5;">Bước 1 / 2</div>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;"><span style="height: 4px; border-radius: 2px; background: #1E55F0;"></span><span style="height: 4px; border-radius: 2px; background: #2B2D33;"></span></div>
    <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 28px;">VỀ BẠN</h1>
    <p style="margin: 0; font-size: 14px; color: #C9CDD6; line-height: 1.5;">Mục tiêu được tính theo cân nặng và giới tính. Bạn có thể sửa bất cứ lúc nào.</p>
  </div>

  <form style="flex: 1 1 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px;">
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px;">Giới tính</legend>
      <div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button type="button" role="radio" aria-checked="true" style="height: 52px; border-radius: 10px; border: 2px solid #0A0A0B; background: #0A0A0B; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer;">Nam</button>
        <button type="button" role="radio" aria-checked="false" style="height: 52px; border-radius: 10px; border: 2px solid #D5D8DF; background: #FFFFFF; color: #1D1D1F; font-size: 16px; font-weight: 600; cursor: pointer;">Nữ</button>
      </div>
    </fieldset>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700;">
        Năm sinh
        <input type="text" inputmode="numeric" value="2003" style="height: 52px; border-radius: 10px; border: 2px solid #D5D8DF; background: #FFFFFF; padding: 0 14px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700;">
        Cân nặng (kg)
        <input type="text" inputmode="decimal" value="65" style="height: 52px; border-radius: 10px; border: 2px solid #1E55F0; background: #FFFFFF; padding: 0 14px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none;">
      </label>
    </div>
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 14px 16px; font-size: 13px; color: #5B6170; line-height: 1.5;">
      Với nữ, bạn có thể bật “Gần/đang trong kỳ” trên trang Hồ sơ để tăng mục tiêu sắt từ 18 lên 28 mg/ngày.
    </div>
    <a href="SetupGoal.dc.html" style="margin-top: auto; text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Tiếp tục</a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { h: this.props.h ?? 844 }; }
}
</script>
</body>
</html>
