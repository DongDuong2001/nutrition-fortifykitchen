<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xoá tài khoản — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: none; background: #0A0A0B; color: #FFFFFF; padding: 16px 20px 18px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 6px;">
    <a href="Profile.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: -12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 28px;">XOÁ TÀI KHOẢN</h1>
  </div>
  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 12px; align-items: flex-start;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D93036" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M12 3.5 2.5 20h19z"></path><path d="M12 10v4.5M12 17.2v.1"></path></svg>
        <div style="font-size: 15px; font-weight: 700; line-height: 1.4;">Xoá vĩnh viễn nhật ký, món tự tạo và hồ sơ. Không thể khôi phục.</div>
      </div>
      <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: #5B6170;">
        <sc-for list="{{lost}}" as="x" hint-placeholder-count="4"><li>{{x.l}}</li></sc-for>
      </ul>
    </div>
    <button type="button" style="height: 48px; border-radius: 9999px; border: 1px solid rgba(0,0,0,0.12); background: #FFFFFF; color: #1D1D1F; font-size: 15px; font-weight: 600;">Tải dữ liệu về (CSV)</button>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700;">
      Gõ XOÁ để xác nhận
      <input type="text" value="" placeholder="XOÁ" autocomplete="off" style="height: 52px; border-radius: 10px; border: 2px solid #D5D8DF; background: #FFFFFF; padding: 0 14px; font-size: 18px; font-weight: 600; outline: none;">
    </label>
  </div>
  <div style="flex: none; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 2px;">
    <button type="button" aria-disabled="true" style="height: 52px; border: 0; border-radius: 9999px; background: #D93036; color: #FFFFFF; font-size: 16px; font-weight: 700; opacity: .45; cursor: not-allowed;">Xoá tài khoản</button>
    <a href="Profile.dc.html" style="text-decoration: none; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D1D1F; font-size: 15px; font-weight: 600;">Huỷ</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lost = [{ l: 'Nhật ký bữa ăn và ngày tập' }, { l: 'Món và công thức bạn tự tạo' }, { l: 'Hồ sơ, cân nặng và mục tiêu' }, { l: 'Cài đặt nhắc nhở' }];
    return { h: this.props.h ?? 844, lost };
  }
}
</script>
</body>
</html>
