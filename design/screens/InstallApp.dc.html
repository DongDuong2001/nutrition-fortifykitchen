<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm vào màn hình chính — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: none; background: #0A0A0B; color: #FFFFFF; padding: 16px 20px 22px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center;">
      <a href="Profile.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
    </div>
    <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 28px; line-height: 1.15;">THÊM VÀO MÀN HÌNH CHÍNH</h1>
  </div>

  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 14px;">
      <div aria-hidden="true" style="width: 64px; height: 64px; flex: none; border-radius: 16px; background: #0A0A0B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-weight: 900; font-size: 22px; color: #FFFFFF; line-height: 1;">H1T</div>
        <div style="width: 26px; height: 4px; border-radius: 2px; background: #1E55F0;"></div>
      </div>
      <div style="min-width: 0;">
        <div style="font-size: 16px; font-weight: 700;">H1T MICRO</div>
        <div style="font-size: 14px; color: #5B6170; line-height: 1.4;">Mở nhanh như ứng dụng, chạy cả khi mất mạng</div>
      </div>
    </div>

    <div role="tablist" aria-label="Thiết bị" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E3E5E9; border-radius: 9999px; padding: 4px;">
      <button type="button" role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 9999px; background: #0A0A0B; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer;">iPhone (Safari)</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 9999px; background: transparent; color: #1D1D1F; font-size: 14px; font-weight: 600; cursor: pointer;">Android (Chrome)</button>
    </div>

    <ol role="tabpanel" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <li style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; min-height: 44px; box-sizing: border-box;">
          <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">{{s.n}}</span>
          <span style="font-size: 15px; line-height: 1.45;">{{s.text}}<sc-if value="{{s.share}}" hint-placeholder-val="{{false}}"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E55F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Chia sẻ" role="img" style="vertical-align: -4px;"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M6 11H5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1"></path></svg></sc-if><sc-if value="{{s.tail}}" hint-placeholder-val="{{false}}"> {{s.tail}}</sc-if></span>
        </li>
      </sc-for>
    </ol>
  </div>

  <div style="flex: none; padding: 12px 16px 24px;">
    <a href="Today.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Đã hiểu</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = [
      { n: '1', text: 'Chạm nút Chia sẻ', share: true, tail: 'ở thanh dưới Safari' },
      { n: '2', text: 'Chọn “Thêm vào MH chính”', share: false, tail: '' },
      { n: '3', text: 'Chạm “Thêm” ở góc phải', share: false, tail: '' }
    ];
    return { h: this.props.h ?? 844, steps };
  }
}
</script>
</body>
</html>
