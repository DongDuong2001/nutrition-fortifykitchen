<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Không tìm thấy món — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;; position: relative;">
  <div aria-hidden="true" style="background: #0A0A0B; height: 150px; flex: none; padding: 16px 20px; box-sizing: border-box; border-radius: 0 0 20px 20px;">
    <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 700; font-size: 20px; color: #FFFFFF;">H1T <span style="color: #A9D1F7;">MICRO</span></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,10,11,0.55);"></div>
  <div role="dialog" aria-modal="true" aria-label="Thêm món vào Trước tập" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #D5D8DF; align-self: center;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="MealSwitcher.dc.html" aria-label="Đổi bữa" style="text-decoration: none; min-height: 44px; margin-left: -8px; padding: 0 8px; border-radius: 10px; color: #1D1D1F; font-size: 18px; display: flex; align-items: center; gap: 6px;">
        <span>Thêm vào: <strong style="font-weight: 700;">Trước tập</strong></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </a>
      <a href="Today.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 22px; background: #F5F5F7; color: #1D1D1F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #F5F5F7; border-radius: 9999px; padding: 0 14px; height: 48px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" aria-label="Tìm món" value="bánh tráng trộn" placeholder="Tìm món: cơm, trứng, chà là…" style="flex: 1 1 0; height: 44px; background: transparent; border: 0; outline: none; color: #1D1D1F; font-size: 16px;">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button aria-pressed="{{c.on}}" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: 0; background: {{c.bg}}; color: {{c.color}};">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 10px 8px 4px;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5M8 8l6 6M14 8l-6 6"></path></svg>
      <div style="font-size: 17px; font-weight: 700;">Không có “bánh tráng trộn”</div>
      <div style="font-size: 14px; color: #5B6170;">Thử từ ngắn hơn, bỏ dấu, hoặc tự tạo món.</div>
      <a href="CreateFood.dc.html" style="margin-top: 8px; text-decoration: none; height: 52px; padding: 0 28px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">+ Tạo món mới</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 6px;">
      <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #5B6170;">Gợi ý gần giống</h2>
      <sc-for list="{{similar}}" as="r" hint-placeholder-count="2">
        <a href="AddFood.dc.html" style="text-decoration: none; color: #1D1D1F; border-radius: 10px; padding: 0 12px; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <span style="font-size: 15px; font-weight: 600;">{{r.name}}</span>
          <span style="font-size: 13px; color: #5B6170; font-variant-numeric: tabular-nums;">{{r.meta}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = ['Yêu thích', 'Tất cả'].map((label) => { const on = label === 'Tất cả'; return { label, on, bg: on ? '#0A0A0B' : '#F5F5F7', color: on ? '#FFFFFF' : '#0A0A0B' }; });
    const similar = [{ name: 'Bánh tráng', meta: '10 g · 33 kcal' }, { name: 'Bánh tráng nướng', meta: '1 cái · 95 kcal' }];
    return { h: this.props.h ?? 844, chips, similar };
  }
}
</script>
</body>
</html>
