<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khoáng chất — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
a:focus-visible,button:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="background: #0A0A0B; color: #FFFFFF; padding: 18px 20px 18px; display: flex; align-items: flex-end; justify-content: space-between; border-radius: 0 0 20px 20px;">
    <div>
      <div style="font-size: 13px; color: #A3A8B5;">Hôm nay, 10/10</div>
      <h1 style="margin: 2px 0 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 700; font-size: 28px; letter-spacing: 0.02em;">VI CHẤT</h1>
    </div>
    <div style="text-align: right;">
      <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums;">8<span style="color: #A3A8B5;">/21</span></div>
      <div style="font-size: 13px; color: #A9D1F7;">đã đạt mục tiêu</div>
    </div>
  </div>

  <div style="flex: 1 1 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div role="tablist" aria-label="Nhóm vi chất" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E3E5E9; padding: 4px; border-radius: 12px;">
      <a role="tab" aria-selected="true" href="Micros.dc.html" style="text-decoration: none; min-height: 44px; border-radius: 9px; background: #0A0A0B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">Khoáng chất · 5/9</a>
      <a role="tab" aria-selected="false" href="MicrosVitamins.dc.html" style="text-decoration: none; min-height: 44px; border-radius: 9px; background: transparent; color: #1D1D1F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Vitamin · 3/12</a>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13px; color: #5B6170; line-height: 1.4;">
      <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 10px; height: 6px; border-radius: 2px; background: #D93036; display: inline-block;"></span>Thiếu (&lt;50%)</span>
      <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 10px; height: 6px; border-radius: 2px; background: #D99A00; display: inline-block;"></span>Trung bình (50–79%)</span>
      <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 10px; height: 6px; border-radius: 2px; background: #16A34A; display: inline-block;"></span>Gần đủ (80–99%)</span>
      <span style="display: inline-flex; align-items: center; gap: 4px; color: #1E55F0; font-weight: 700;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Đạt (≥100%)</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 6px 16px;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="9">
        <a href="NutrientDetail.dc.html" style="text-decoration: none; color: #1D1D1F; min-height: 44px; box-sizing: border-box; justify-content: center; padding: 7px 0; display: flex; flex-direction: column; gap: 6px; border-bottom: {{s.line}};">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
            <span style="font-weight: 600; flex: 1 1 0;">{{s.name}}</span>
            <sc-if value="{{s.maxed}}" hint-placeholder-val="{{false}}">
              <span style="display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: #1E55F0;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Đạt
              </span>
            </sc-if>
            <span style="color: #5B6170; font-size: 13px; font-variant-numeric: tabular-nums;">{{s.value}}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </div>
          <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px;">
            <sc-for list="{{s.segs}}" as="g" hint-placeholder-count="10"><div style="height: 6px; border-radius: 2px; background: {{g.bg}};"></div></sc-for>
          </div>
        </a>
      </sc-for>
    </div>

    <div style="font-size: 12px; color: #5B6170; line-height: 1.5;">Mục tiêu theo cân nặng, giới tính và ngày tập · tham khảo khuyến nghị cho người Việt Nam (2016).</div>
  </div>

  <nav aria-label="Điều hướng chính" style="height: 72px; flex: none; background: #0A0A0B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="Today.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #8C92A0; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Hôm nay
    </a>
    <a href="Micros.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #FFFFFF; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"></path></svg>Vi chất
    </a>
    <div style="display: flex; justify-content: center;">
      <a href="AddFood.dc.html" aria-label="Thêm món" style="width: 52px; height: 52px; border-radius: 14px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>
    <a href="Training.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #8C92A0; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"></path></svg>Ngày tập
    </a>
    <a href="Profile.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: #8C92A0; font-size: 12px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Hồ sơ
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = (p) => (p >= 100 ? '#1E55F0' : p >= 80 ? '#16A34A' : p >= 50 ? '#D99A00' : '#D93036');
    const segs = (p) => { const n = Math.min(10, Math.floor(p / 10)); return Array.from({ length: 10 }, (_, i) => ({ bg: i < n ? tone(p) : '#E3E5E9' })); };
    const list = [
      { name: 'Natri (muối)', value: '2.900 / 2.751–4.127 mg', p: 100, coach: true },
      { name: 'Sắt', value: '11 / 8 mg', p: 100, coach: true },
      { name: 'Kẽm', value: '12,4 / 12 mg', p: 100, coach: true },
      { name: 'Phốt pho', value: '1.050 / 700 mg', p: 100, coach: false },
      { name: 'Selen', value: '52 / 34 µg', p: 100, coach: false },
      { name: 'Đồng', value: '0,8 / 0,9 mg', p: 89, coach: false },
      { name: 'Kali', value: '3.900 / 5.200 mg', p: 75, coach: true },
      { name: 'Magie', value: '410 / 600 mg', p: 68, coach: true },
      { name: 'Canxi', value: '331 / 1.200 mg', p: 28, coach: true }
    ];
    const stats = list.map((s, i) => ({ ...s, maxed: s.p >= 100, segs: segs(s.p), line: i === list.length - 1 ? '0' : '1px solid #EEF0F3' }));
    return { h: this.props.h ?? 844, stats };
  }
}
</script>
</body>
</html>
