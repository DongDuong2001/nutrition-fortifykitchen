<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chà là — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: none; background: #0A0A0B; color: #FFFFFF; padding: 12px 20px 18px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 6px;">
    <a href="AddFood.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; margin-left: -12px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 28px;">CHÀ LÀ</h1>
    <p style="margin: 0; font-size: 13px; color: #A3A8B5;">Hợp dùng trước tập</p>
  </div>

  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: flex-end; gap: 8px;">
      <label for="fd-size" style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; width: 104px; flex: none;">Khẩu phần
        <span style="display: flex; align-items: center; gap: 6px; height: 48px; box-sizing: border-box; border-radius: 10px; border: 2px solid #1E55F0; padding: 0 12px; background: #FFFFFF;">
          <input id="fd-size" type="text" inputmode="decimal" value="30" style="width: 40px; height: 44px; border: 0; outline: none; background: transparent; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: #1D1D1F;">
          <span style="color: #5B6170; font-size: 14px; font-weight: 400;">g</span>
        </span>
      </label>
      <sc-for list="{{servings}}" as="s" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{s.on}}" style="height: 48px; padding: 0 14px; border: 0; border-radius: 10px; background: {{s.bg}}; color: {{s.color}}; font-size: 14px; font-weight: 600; cursor: pointer;">{{s.label}}</button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums;">84</div>
          <div style="font-size: 13px; color: #5B6170;">kcal</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums;">22 g</div>
          <div style="font-size: 13px; color: #5B6170;">Carb</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums;">0,7 g</div>
          <div style="font-size: 13px; color: #5B6170;">Đạm</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums;">0,1 g</div>
          <div style="font-size: 13px; color: #5B6170;">Béo</div>
        </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px 6px; display: flex; flex-direction: column;">
      <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 700;">Vi chất trong 30 g</h2>
      <sc-for list="{{micros}}" as="m" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; border-top: 1px solid #EEF0F3; font-size: 15px;">
          <span>{{m.name}}</span>
          <span style="font-variant-numeric: tabular-nums;"><span style="font-weight: 600;">{{m.value}}</span> <span style="font-size: 13px; color: #5B6170; margin-left: 6px;">{{m.pct}}</span></span>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-left: 4px solid #1E55F0; border-radius: 18px; padding: 12px 16px; font-size: 15px;">
      <span style="font-weight: 700; color: #1E55F0;">Mẹo:</span> 2–3 quả trước tập 30–45 phút.
    </div>
  </div>

  <div style="flex: none; padding: 10px 16px 18px; background: #F5F5F7;">
    <a href="TodayAdded.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Thêm vào Trước tập</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const servings = ['30 g', '3 quả', '100 g'].map((label) => { const on = label === '30 g'; return { label, on, bg: on ? '#0A0A0B' : '#E3E5E9', color: on ? '#FFFFFF' : '#1D1D1F' }; });
    const micros = [
      { name: 'Kali', value: '197 mg', pct: '4%' },
      { name: 'Magie', value: '13 mg', pct: '2%' },
      { name: 'Canxi', value: '19 mg', pct: '2%' },
      { name: 'Sắt', value: '0,3 mg', pct: '4%' },
      { name: 'Đồng', value: '0,1 mg', pct: '12%' },
      { name: 'Vitamin B6', value: '0,05 mg', pct: '4%' }
    ];
    return { h: this.props.h ?? 844, servings, micros };
  }
}
</script>
</body>
</html>
