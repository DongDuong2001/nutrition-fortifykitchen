<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xu hướng — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="background: #0A0A0B; color: #FFFFFF; padding: 8px 20px 16px 8px; display: flex; align-items: center; gap: 4px; border-radius: 0 0 20px 20px;">
    <a href="Today.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div>
      <div style="font-size: 13px; color: #A3A8B5;">7 ngày gần nhất · 04–10/10</div>
      <h1 style="margin: 2px 0 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 700; font-size: 28px; letter-spacing: 0.02em;">XU HƯỚNG</h1>
    </div>
  </div>

  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div role="group" aria-label="Khoảng thời gian" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E3E5E9; padding: 4px; border-radius: 12px;">
      <button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 9px; background: #0A0A0B; color: #FFFFFF; font-size: 14px; font-weight: 700;">7 ngày</button>
      <button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: #1D1D1F; font-size: 14px; font-weight: 600;">30 ngày</button>
    </div>

    <section aria-labelledby="t-energy" style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <h2 id="t-energy" style="margin: 0; font-size: 16px; font-weight: 700;">Năng lượng</h2>
      <div role="img" aria-label="{{chartLabel}}" style="display: flex; gap: 6px;">
        <div style="flex: 1 1 0; min-width: 0; position: relative; height: 164px;">
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: {{lineHi}}px; border-top: 1.5px dashed #A3A8B5;"></div>
          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: {{lineLo}}px; border-top: 1.5px dashed #A3A8B5;"></div>
          <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: end;">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
              <div aria-label="{{b.aria}}" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%;">
                <div style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #1D1D1F; padding-bottom: 2px;">{{b.value}}</div>
                <div style="width: 24px; height: {{b.h}}px; border-radius: 6px 6px 2px 2px; background: {{b.bg}};"></div>
              </div>
            </sc-for>
          </div>
        </div>
        <div aria-hidden="true" style="width: 38px; flex: none; position: relative; height: 164px;">
          <div style="position: absolute; right: 0; bottom: {{labHi}}px; font-size: 12px; color: #5B6170; font-variant-numeric: tabular-nums;">2.275</div>
          <div style="position: absolute; right: 0; bottom: {{labLo}}px; font-size: 12px; color: #5B6170; font-variant-numeric: tabular-nums;">1.950</div>
        </div>
      </div>
      <div style="display: flex; gap: 6px; padding-right: 44px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div style="flex: 1 1 0; min-width: 0; text-align: center; font-size: 12px; color: #5B6170; line-height: 1.3;">{{b.day}}<br>{{b.sub}}</div>
        </sc-for>
      </div>
      <div style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">TB 1.982 kcal · 4/6 ngày trong mục tiêu</div>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #5B6170;">
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: #1E55F0;"></span>Trong mục tiêu</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: #D93036;"></span>Thiếu</span>
      </div>
    </section>

    <section aria-labelledby="t-micro" style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px 6px; display: flex; flex-direction: column;">
      <h2 id="t-micro" style="margin: 0 0 4px; font-size: 16px; font-weight: 700;">Vi chất thường thiếu (7 ngày)</h2>
      <sc-for list="{{micros}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px solid #EEF0F3; justify-content: center;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 28px;">
            <span style="font-weight: 600; flex: 1 1 0;">{{r.name}}</span>
            <span style="font-size: 13px; color: {{r.tc}}; font-weight: 600; font-variant-numeric: tabular-nums;">{{r.pct}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px;">
            <sc-for list="{{r.segs}}" as="g" hint-placeholder-count="10"><div style="height: 6px; border-radius: 2px; background: {{g.bg}};"></div></sc-for>
          </div>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="t-pro" style="background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <h2 id="t-pro" style="margin: 0; font-size: 16px; font-weight: 700;">Đạm trung bình</h2>
        <div style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;"><span style="color: #1E55F0;">112 g</span> / 104 g ✓</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px;">
        <sc-for list="{{proSegs}}" as="g" hint-placeholder-count="10"><div style="height: 6px; border-radius: 2px; background: {{g.bg}};"></div></sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const seg = (p, empty) => { const n = Math.min(10, Math.floor(p / 10)); const c = (p >= 100 ? '#1E55F0' : p >= 80 ? '#16A34A' : p >= 50 ? '#D99A00' : '#D93036'); return Array.from({ length: 10 }, (_, i) => ({ bg: i < n ? c : empty })); };
    const fmt = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const scale = 128 / 2500;
    const raw = [
      { day: 'CN', sub: '04', v: 2050 }, { day: 'T2', sub: '05', v: 1890 }, { day: 'T3', sub: '06', v: 2210 },
      { day: 'T4', sub: '07', v: 1640 }, { day: 'T5', sub: '08', v: 2120 }, { day: 'T6', sub: '09', v: 1980 },
      { day: 'T7', sub: '10', v: 1041 }
    ];
    const bars = raw.map((b, i) => {
      const today = i === 6;
      const inBand = b.v >= 1950 && b.v <= 2275;
      const bg = today ? 'repeating-linear-gradient(135deg, #A9C1FA 0 6px, #C9D8FC 6px 12px)' : (inBand ? '#1E55F0' : '#D93036');
      const state = today ? 'đang ghi' : (inBand ? 'trong mục tiêu' : 'thiếu');
      return { day: b.day, sub: today ? b.sub + ' · nay' : b.sub, value: fmt(b.v), h: Math.round(b.v * scale), bg, aria: b.day + ' ' + b.sub + ': ' + fmt(b.v) + ' kcal, ' + state };
    });
    bars[6].sub = '10 · đang ghi';
    const micros = [
      { name: 'Vitamin D', p: 18 }, { name: 'Canxi', p: 41, coach: true }, { name: 'Kali', p: 72 },
      { name: 'Magie', p: 70 }, { name: 'Folate', p: 76 }
    ].map((m) => ({ name: m.name, coach: !!m.coach, pct: m.p + '%' + (m.p < 50 ? ' · thiếu' : ''), tc: m.p < 50 ? '#D93036' : '#5B6170', segs: seg(m.p, '#E3E5E9') }));
    const proSegs = seg(100, '#E3E5E9');
    const chartLabel = 'Biểu đồ năng lượng 7 ngày, mục tiêu 1.950 đến 2.275 kcal. Trung bình 1.982 kcal, 4 trên 6 ngày trong mục tiêu. Hôm nay 1.041 kcal, đang ghi.';
    return { h: this.props.h ?? 844, bars, micros, proSegs, chartLabel, lineHi: Math.round(2275 * scale), lineLo: Math.round(1950 * scale), labHi: Math.round(2275 * scale) - 7, labLo: Math.round(1950 * scale) - 7 };
  }
}
</script>
</body>
</html>
