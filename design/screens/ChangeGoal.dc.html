<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đổi mục tiêu — H1T MICRO</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,400..900;1,50..125,400..900&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E55F0}a:hover{color:#0A0A0B}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #1E55F0;outline-offset:2px}
a:active,button:active{transform:scale(0.97)}
a,button{transition:transform 150ms ease-out}
a,button,label,input{touch-action:manipulation}
a,button{cursor:pointer}
@media (prefers-reduced-motion: reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: {{h}}px; box-sizing: border-box; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: 'Be Vietnam Pro', sans-serif; display: flex; flex-direction: column;">
  <div style="flex: none; background: #0A0A0B; color: #FFFFFF; padding: 16px 20px 18px; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 6px;">
    <a href="Profile.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 8px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: -12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Saira', sans-serif; font-style: italic; font-stretch: 118%; font-weight: 800; font-size: 28px;">MỤC TIÊU</h1>
  </div>
  <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div role="radiogroup" aria-label="Mục tiêu" style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{g.on}}" style="text-align: left; min-height: 60px; border-radius: 12px; border: 2px solid {{g.border}}; background: #FFFFFF; color: #1D1D1F; padding: 8px 14px; display: flex; align-items: center; gap: 12px;">
          <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 10px; border: 2px solid {{g.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{g.dot}};"></span></span>
          <span style="flex: 1 1 0; display: flex; flex-direction: column;">
            <span style="font-size: 16px; font-weight: 700;">{{g.name}}</span>
            <span style="font-size: 13px; color: #5B6170;">{{g.note}}</span>
          </span>
          <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">{{g.kcal}}</span>
        </button>
      </sc-for>
    </div>
    <div role="group" aria-labelledby="dur" style="display: flex; flex-direction: column; gap: 6px;">
      <div id="dur" style="font-size: 15px; font-weight: 700;">Ngày tập mặc định</div>
      <div role="radiogroup" aria-labelledby="dur" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{durs}}" as="d" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{d.on}}" style="height: 44px; border-radius: 22px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.color}}; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0;">{{d.l}}</button>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; line-height: 1.4; color: #5B6170;">Đổi mục tiêu áp dụng từ hôm nay, không đổi các ngày cũ.</div>
  </div>
  <div style="flex: none; padding: 8px 16px 16px;">
    <a href="Profile.dc.html" style="text-decoration: none; height: 52px; border-radius: 9999px; background: #1E55F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Lưu mục tiêu</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":null,"default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const goals = [
      { name: 'Tăng cơ', note: 'Ăn dư một chút để lên cơ', kcal: '2.275–2.600' },
      { name: 'Giữ cân', note: 'Duy trì cân nặng hiện tại', kcal: '1.950–2.275', on: true },
      { name: 'Giảm mỡ', note: 'Thâm hụt vừa phải, giữ cơ', kcal: '1.625–1.950' },
      { name: 'Giảm mỡ nhanh', note: 'Ngắn hạn, tối đa 4–6 tuần', kcal: '1.300–1.625' }
    ].map((g) => ({ ...g, on: !!g.on, border: g.on ? '#1E55F0' : '#E3E5E9', dot: g.on ? '#1E55F0' : 'transparent' }));
    const durs = [45, 60, 90, 120].map((m) => {
      const on = m === 60;
      return { l: m + ' phút', on, border: on ? '#1E55F0' : '#D5D8DF', bg: on ? '#1E55F0' : '#FFFFFF', color: on ? '#FFFFFF' : '#1D1D1F' };
    });
    return { h: this.props.h ?? 844, goals, durs };
  }
}
</script>
</body>
</html>
