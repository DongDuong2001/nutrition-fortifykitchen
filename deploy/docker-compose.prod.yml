# Production stack for one VPS. Database and Auth are Supabase (no local Postgres).
# deploy/deploy.sh runs it: web and api are pulled from GitHub's registry at IMAGE_TAG (the commit sha, built by
# .github/workflows/images.yml); `build:` stays so `deploy.sh <ref> --build` can still build them here.
name: nutrition

# The local driver keeps logs compressed on disk and rotates them (json-file kept them as plain text)
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:?set NEXT_PUBLIC_API_MODE in deploy/.env.prod}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in deploy/.env.prod}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in deploy/.env.prod}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in deploy/.env.prod}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in deploy/.env.prod}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:?set NEXT_PUBLIC_HCAPTCHA_SITE_KEY in deploy/.env.prod}
    image: ghcr.io/dongduong2001/nutrition-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # node server.js (standalone) settles at about 110 MB RSS idle and 150 MB after browsing; 512 MB of heap is ample
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  api:
    build:
      context: ../apps/api
    image: ghcr.io/dongduong2001/nutrition-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
