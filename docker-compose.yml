services:
  postgres:
    image: postgres:17-alpine
    container_name: nutrition-postgres-17
    restart: unless-stopped
    ports:
      # Bind strictly to localhost so Docker iptables bypass does not expose 5432 to public internet
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_nutrition_schema.up.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
