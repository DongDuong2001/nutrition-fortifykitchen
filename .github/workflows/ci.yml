name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api:
    name: Backend CI (Go 1.24+)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum
      - name: Install dependencies
        working-directory: apps/api
        run: go mod download
      - name: Lint & Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Run Tests
        working-directory: apps/api
        run: go test -v ./...
      - name: Build
        working-directory: apps/api
        run: go build -v ./cmd/server

  web:
    name: Frontend CI (Next.js 15+ / React 19)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Run Tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build
      # perf/live-bundle: a live build (NEXT_PUBLIC_API_MODE=live, into .next-live) ships no sample day or sample food
      - name: Live bundle has no sample data (check:live-bundle)
        working-directory: apps/web
        run: npm run check:live-bundle
