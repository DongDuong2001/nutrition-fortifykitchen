# Production images, built here instead of on the VPS (ci/ghcr-images). Every push to main (and a manual run) builds
# the web and the API image and pushes them to GitHub's registry, tagged with the commit sha and `main`.
# deploy/deploy.sh <sha> then pulls them: the VPS no longer builds (no 1.7 GB build peak, no BuildKit cache on its disk).
#
# NEXT_PUBLIC_* are inlined into the web build, so they come from the repo's Actions variables (Settings → Secrets and
# variables → Actions → Variables): NEXT_PUBLIC_API_MODE, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL,
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_HCAPTCHA_SITE_KEY. They are public values (the
# browser gets them anyway); no secret goes into an image.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/dongduong2001

jobs:
  web:
    name: Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/nutrition-web:${{ github.sha }}
            ${{ env.REGISTRY }}/nutrition-web:main
          build-args: |
            NEXT_PUBLIC_API_MODE=${{ vars.NEXT_PUBLIC_API_MODE }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_HCAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  api:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/nutrition-api:${{ github.sha }}
            ${{ env.REGISTRY }}/nutrition-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
