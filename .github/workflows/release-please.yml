# Releases from the commits on main: release-please keeps one "chore(main): release x.y.z" PR open with the next version and the
# changelog (feat → minor, fix → patch, "!" or BREAKING CHANGE → major). Merging that PR (after review, like any other) tags vX.Y.Z
# and publishes the GitHub release. The in-app "Có gì mới" (apps/web/lib/releases.ts) stays hand-written.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
